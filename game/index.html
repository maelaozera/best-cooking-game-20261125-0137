<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dapur Kilat — Game Memasak</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #3d2b1f; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Dibacakan, tidak ditampilkan: baris status yang diumumkan pembaca layar. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Dapur Kilat: rakit pesanan, panggang patty, cincang sayur, dan sajikan sebelum waktu habis"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
